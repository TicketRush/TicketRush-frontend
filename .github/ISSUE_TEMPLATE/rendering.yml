name: Character Rendering
description: 3D 캐릭터 렌더링 기능 구현
title: "[FE] "
labels: ["feature"]
assignees: []

body:
  - type: textarea
    attributes:
      label: 📦 어떤 작업인가요?
      description: 작업 내용을 간단히 적어주세요.
      placeholder: Blender로 제작한 캐릭터를 웹에서 3D로 렌더링
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📌 작업 상세 내용
      description: 구체적인 작업 내용을 작성해주세요.
      placeholder: |
        - React Three Fiber 설치
        - GLB 모델 로드
        - Canvas 구성
        - 조명 및 카메라 설정
        - Character 컴포넌트 구현
    validations:
      required: true

  - type: textarea
    attributes:
      label: 👀 참고 사항
      description: 참고할 내용이 있다면 작성해주세요.
      placeholder: public/models 경로에 GLB 파일 위치

  - type: textarea
    attributes:
      label: ✅ 완료 조건
      description: 완료 기준을 작성해주세요.
      placeholder: |
        - [ ] 3D 캐릭터가 정상적으로 표시된다
        - [ ] 모델이 깨지지 않는다
        - [ ] 컴포넌트로 재사용 가능하다
    validations:
      required: true
