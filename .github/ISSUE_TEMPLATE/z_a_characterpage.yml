name: Character Page
description: 캐릭터 커스터마이징 페이지 제작
title: "[FE] "
labels: ["z_a_characterpage"]
assignees: []

body:
  - type: textarea
    attributes:
      label: 📦 어떤 작업인가요?
      description: 작업 내용을 간단히 적어주세요.
      placeholder: 캐릭터 커스터마이징 화면 구현
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📌 작업 상세 내용
      description: 구체적인 작업 내용을 작성해주세요.
      placeholder: |
        - 레이아웃 구성
        - 컴포넌트 분리
        - 스타일 적용
        - 3D 모델 들어갈 자리 구성
    validations:
      required: true

  - type: textarea
    attributes:
      label: 👀 참고 사항
      description: 참고할 내용이 있다면 작성해주세요.
      placeholder: |
        - 피그마 디자인 참고
        - react로 시범 화면 먼저 구성
    validations:
      required: true

  - type: textarea
    attributes:
      label: ✅ 완료 조건
      description: 완료 기준을 작성해주세요.
      placeholder: |
        - [ ] UI가 정상적으로 렌더링된다
        - [ ] 기능이 정상 동작한다
        - [ ] 피그마 디자인과 동일하다.
    validations:
      required: true
