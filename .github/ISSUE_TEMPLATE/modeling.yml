name: Base Character Model
description: 기본 캐릭터 모델링 작업
title: "[3D] "
labels: ["feature"]
assignees: []

body:
  - type: textarea
    attributes:
      label: 📦 어떤 작업인가요?
      description: 작업 내용을 간단히 적어주세요.
      placeholder: Blender로 기본 캐릭터 모델 제작
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📌 작업 상세 내용
      description: 구체적인 작업 내용을 작성해주세요.
      placeholder: |
        - 머리, 몸통, 팔, 다리 모델링
        - 저폴리 구조로 제작
        - 텍스처 및 머티리얼 설정
        - Scale 및 Transform 적용
    validations:
      required: true

  - type: textarea
    attributes:
      label: 👀 참고 사항
      description: 참고할 내용이 있다면 작성해주세요.
      placeholder: 웹 렌더링 성능 및 커스터마이징 구조 고려

  - type: textarea
    attributes:
      label: ✅ 완료 조건
      description: 완료 기준을 작성해주세요.
      placeholder: |
        - [ ] 캐릭터 모델이 완성된다
        - [ ] GLB 파일로 export 가능하다
        - [ ] 웹에서 사용 가능한 상태이다
    validations:
      required: true
