name: Customization UI
description: 캐릭터 커스터마이징 UI 구현
title: "[FE] "
labels: ["feature"]
assignees: []

body:
  - type: textarea
    attributes:
      label: 📦 어떤 작업인가요?
      description: 작업 내용을 간단히 적어주세요.
      placeholder: 캐릭터 커스터마이징을 위한 UI 구현
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📌 작업 상세 내용
      description: 구체적인 작업 내용을 작성해주세요.
      placeholder: |
        - 피부색 선택 UI 구현
        - 옷 및 아이템 선택 UI 구현
        - 버튼 및 컨트롤 구성
    validations:
      required: true

  - type: textarea
    attributes:
      label: 👀 참고 사항
      description: 참고할 내용이 있다면 작성해주세요.
      placeholder: 초기에는 UI만 구현

  - type: textarea
    attributes:
      label: ✅ 완료 조건
      description: 완료 기준을 작성해주세요.
      placeholder: |
        - [ ] UI가 정상적으로 표시된다
        - [ ] 사용자 입력이 가능하다
    validations:
      required: true
